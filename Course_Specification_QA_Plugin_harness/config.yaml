# M2 - Model config (same shape as Harness/config.yaml)
# Code asks for a profile, never a model tag. Change models here.

runtime:
  base_url: http://localhost:11434
  api: native            # native = Ollama /api/chat ; openai = /v1/chat/completions
  timeout_s: 300

profiles:
  fast:
    model: qwen3:4b-q4_K_M
    temperature: 0
    num_ctx: 8192
    num_predict: 512
    keep_alive: 10m
    think: false

  reasoning:               # default for the QA agents: specs + tool results need context
    model: qwen3:8b-q4_K_M
    temperature: 0
    num_ctx: 16384
    num_predict: 1024
    keep_alive: 10m
    think: false

agents:                    # which profile each pipeline stage uses, and its step budget
  course-reviewer:    {profile: reasoning, max_steps: 8}
  curriculum-auditor: {profile: reasoning, max_steps: 10}
  verdict-writer:     {profile: fast,      max_steps: 4}

logging:
  file: logs/calls.jsonl
